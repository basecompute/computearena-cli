name: Build bundles

# Reusable build shared by rc-staging.yml and release.yml, so a staging build is
# the same artifact the release will ship rather than a near copy that drifts.
# Produces one flat tarball per platform (computearena + LICENSE + README.md)
# with a .sha256 sidecar, smoke-tests the packaged binary offline, and uploads
# it as the workflow artifact bundle-<platform>. Publishing is the caller's job.
#
# Platforms mirror the BaseRT engine bundles. macOS arm64 builds natively on the
# hosted Apple Silicon runner. Linux x86_64 and arm64 build through `cross`:
# its Ubuntu 20.04 images give the binaries a glibc 2.31 floor (a native
# ubuntu-latest build needs 2.39 and refuses to start on Ubuntu 22.04 or Debian
# 12), and the lockfile pulls in aws-lc-sys, which needs cmake plus a target C
# toolchain to cross-compile — the cross images ship both, a bare linker
# override does not. Both Linux bundles are then smoke-tested inside a stock
# ubuntu:22.04 container, the arm64 one under QEMU, which is also the only way
# to execute that binary on the x86_64 runner.
#
# The macOS binary is signed with the organisation's Developer ID (hardened
# runtime, trusted timestamp) and notarized with Apple before packaging, when
# the caller supplies the secrets; releases require it, staging warns without
# it. BaseRT ships ad-hoc linker-signed binaries; this does not.
#
# Unit and integration tests are CI's job (ci.yml runs them on every push);
# this workflow only proves the shipped artifact.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build. Callers resolve branches and tags to a SHA first so every bundle and the release target agree.
        required: true
        type: string
      version:
        description: Version the bundle names carry. Callers gate it against the Cargo workspace before calling.
        required: true
        type: string
      suffix:
        description: Appended to bundle names, e.g. "-staging". Empty for releases.
        required: false
        type: string
        default: ""
      require_signing:
        description: Fail if the Apple signing secrets are absent (releases). When false, an unsigned macOS binary is a warning (staging before the secrets exist).
        required: false
        type: boolean
        default: false
    # Apple Developer ID signing + notarization of the macOS binary. Callers
    # pass `secrets: inherit`; all five are needed together, the identity is
    # optional. See docs/releasing.md for how to produce them.
    secrets:
      APPLE_DEVELOPER_ID_P12:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_IDENTITY:
        required: false
      APPLE_NOTARY_KEY_P8:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
    outputs:
      macos_signed:
        description: '"true" when the macOS binary was Developer ID signed and notarized'
        value: ${{ jobs.macos-arm64.outputs.signed }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}
  SUFFIX: ${{ inputs.suffix }}
  CROSS_VERSION: "0.2.5"
  CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 45   # includes waiting for Apple's notary service
    outputs:
      signed: ${{ steps.gate.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build
        run: cargo build --locked --release --target aarch64-apple-darwin -p computearena-cli

      - name: Decide whether to sign and notarize
        id: gate
        # The secrets context cannot be used in `if:`, so presence is decided
        # here. Partial configuration is always an error: it means a secret
        # was renamed or rotated wrongly, not that signing was meant to be off.
        env:
          REQUIRE: ${{ inputs.require_signing }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization enabled."
          elif [ "$(echo $missing | wc -w)" -eq 5 ]; then
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::Apple signing secrets are not configured and this build requires a signed macOS binary (missing:$missing)"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS binary will carry only the linker's ad-hoc signature: Apple signing secrets are not configured (missing:$missing)"
          else
            echo "::error::Apple signing secrets are partially configured (missing:$missing); all five are needed together"
            exit 1
          fi

      - name: Sign with Developer ID (hardened runtime, timestamped)
        if: steps.gate.outputs.signed == 'true'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: .github/scripts/macos_sign.sh sign target/aarch64-apple-darwin/release/computearena

      - name: Notarize with Apple
        if: steps.gate.outputs.signed == 'true'
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: .github/scripts/macos_sign.sh notarize target/aarch64-apple-darwin/release/computearena

      - name: Package
        # After signing: the signature lives inside the Mach-O, so the tarball
        # carries it. Packaging first would ship an unsigned copy.
        run: .github/scripts/package.sh target/aarch64-apple-darwin/release/computearena "computearena-macos-arm64-${VERSION}${SUFFIX}" dist

      - name: Smoke test the packaged binary
        run: sh .github/scripts/smoke_test.sh "dist/computearena-macos-arm64-${VERSION}${SUFFIX}.tar.gz" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain
        if: always()
        run: .github/scripts/macos_sign.sh cleanup

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        # Pinned release binary, checksum verified, rather than `cargo install`
        # (a multi-minute compile) or a third-party installer action.
        run: |
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CROSS_SHA256}  cross.tar.gz" | sha256sum -c -
          tar -xzf cross.tar.gz -C "$HOME/.cargo/bin" cross cross-util
          rm cross.tar.gz
          cross --version

      - name: Build
        run: cross build --locked --release --target "$TARGET" -p computearena-cli

      - name: Package
        run: .github/scripts/package.sh "target/${TARGET}/release/computearena" "computearena-linux-${ARCH}-${VERSION}${SUFFIX}" dist

      - name: Enable arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Smoke test the packaged binary (ubuntu:22.04)
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e VERSION -e ARCH -e SUFFIX \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/.github/scripts:/scripts:ro" \
            ubuntu:22.04 \
            sh -c 'sh /scripts/smoke_test.sh "/dist/computearena-linux-${ARCH}-${VERSION}${SUFFIX}.tar.gz" "$VERSION"'

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
